<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5efe2" />
    <title>오늘의 행운 숫자</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Gowun+Batang:wght@400;700&display=swap');

      :root {
        --ink: #173f3a;
        --muted: #6c7b73;
        --paper: #f5efe2;
        --card: #fffdf8;
        --coral: #e66e50;
        --gold: #e9b949;
        --line: rgba(23, 63, 58, 0.13);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--ink);
        background:
          radial-gradient(circle at 85% 14%, rgba(233, 185, 73, 0.22) 0 8rem, transparent 8.1rem),
          linear-gradient(135deg, #f5efe2 0%, #f8e8d8 54%, #dcebe1 100%);
        font-family: 'DM Sans', sans-serif;
      }

      main {
        width: min(100% - 40px, 1080px);
        min-height: 100vh;
        margin: 0 auto;
        display: grid;
        grid-template-rows: auto 1fr auto;
        padding: 32px 0 28px;
      }

      header { display: flex; justify-content: space-between; align-items: center; }

      .brand { display: flex; gap: 11px; align-items: center; font-weight: 700; letter-spacing: 0.02em; }
      .brand-mark { color: var(--coral); font-size: 25px; }
      .date { color: var(--muted); font-size: 13px; }

      .hero {
        display: grid;
        grid-template-columns: minmax(0, 0.9fr) minmax(300px, 1.1fr);
        align-items: center;
        gap: clamp(44px, 9vw, 110px);
        padding: 56px 0 70px;
      }

      .eyebrow { margin: 0 0 18px; color: var(--coral); font-size: 12px; font-weight: 700; letter-spacing: 0.17em; }
      h1 { max-width: 500px; margin: 0; font-family: 'Gowun Batang', serif; font-size: clamp(42px, 6vw, 76px); line-height: 1.13; letter-spacing: -0.04em; }
      .intro { max-width: 360px; margin: 24px 0 0; color: var(--muted); font-size: 16px; line-height: 1.8; }

      .number-wrap { position: relative; display: grid; place-items: center; }
      .number-card {
        position: relative;
        width: min(100%, 430px);
        aspect-ratio: 1 / 1;
        display: grid;
        place-items: center;
        overflow: hidden;
        border: 1px solid rgba(23, 63, 58, 0.08);
        border-radius: 8px;
        background: var(--card);
        box-shadow: 18px 22px 0 rgba(23, 63, 58, 0.08), 0 20px 50px rgba(98, 73, 41, 0.11);
      }
      .number-card::before { content: ''; position: absolute; width: 65%; aspect-ratio: 1; border: 1px solid rgba(230, 110, 80, 0.25); border-radius: 50%; }
      .number-card::after { content: ''; position: absolute; width: 45%; aspect-ratio: 1; border: 1px dashed rgba(233, 185, 73, 0.58); border-radius: 50%; transform: rotate(25deg); }
      .number { position: relative; z-index: 1; color: var(--coral); font-size: clamp(110px, 18vw, 190px); font-weight: 700; line-height: 1; letter-spacing: -0.08em; }
      .number-label { position: absolute; z-index: 2; bottom: 26px; color: var(--muted); font-size: 12px; letter-spacing: 0.12em; }

      .actions { display: flex; align-items: center; gap: 16px; margin-top: 34px; }
      button { border: 0; border-radius: 999px; padding: 14px 21px; color: #fffdf8; background: var(--ink); font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; transition: transform 180ms ease, background 180ms ease; }
      button:hover { background: var(--coral); transform: translateY(-2px); }
      button:focus-visible { outline: 3px solid var(--gold); outline-offset: 4px; }
      .hint { color: var(--muted); font-size: 12px; }

      footer { display: flex; justify-content: space-between; border-top: 1px solid var(--line); padding-top: 18px; color: var(--muted); font-size: 12px; }

      @media (max-width: 700px) {
        main { width: min(100% - 32px, 500px); padding-top: 24px; }
        header { align-items: flex-start; }
        .date { max-width: 120px; text-align: right; line-height: 1.5; }
        .hero { grid-template-columns: 1fr; gap: 44px; padding: 64px 0 56px; }
        h1 { font-size: clamp(42px, 14vw, 66px); }
        .intro { margin-top: 18px; font-size: 15px; }
        .number-card { width: min(100%, 350px); box-shadow: 10px 13px 0 rgba(23, 63, 58, 0.08), 0 16px 35px rgba(98, 73, 41, 0.1); }
        .actions { flex-wrap: wrap; }
        footer { gap: 16px; line-height: 1.5; }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div class="brand"><span class="brand-mark" aria-hidden="true">✦</span><span>LUCKY NOTE</span></div>
        <time class="date" id="today"></time>
      </header>

      <section class="hero" aria-labelledby="page-title">
        <div>
          <p class="eyebrow">A LITTLE SIGN FOR TODAY</p>
          <h1 id="page-title">오늘,<br />당신의 숫자</h1>
          <p class="intro">잠깐 멈춰서 마음에 담아둘 숫자를 골라보세요. 작은 행운은 생각보다 가까이 있습니다.</p>
          <div class="actions">
            <button id="draw-button" type="button">다시 뽑기 <span aria-hidden="true">↗</span></button>
            <span class="hint">오늘 하루를 위한 숫자</span>
          </div>
        </div>

        <div class="number-wrap">
          <div class="number-card" aria-live="polite">
            <span class="number" id="lucky-number">7</span>
            <span class="number-label">YOUR LUCKY NUMBER</span>
          </div>
        </div>
      </section>

      <footer><span>오늘의 좋은 흐름을 믿어보세요.</span><span>01 — 365</span></footer>
    </main>

    <script>
      const today = new Date();
      const dateFormatter = new Intl.DateTimeFormat('ko-KR', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });
      document.querySelector('#today').textContent = dateFormatter.format(today);

      const dayKey = `${today.getFullYear()}-${today.getMonth() + 1}-${today.getDate()}`;
      let seed = [...dayKey].reduce((total, character) => total + character.charCodeAt(0), 0);
      const numberElement = document.querySelector('#lucky-number');
      const drawButton = document.querySelector('#draw-button');

      function drawNumber() {
        seed = (seed * 9301 + 49297) % 233280;
        numberElement.textContent = String(Math.floor((seed / 233280) * 99) + 1);
      }

      drawNumber();
      drawButton.addEventListener('click', drawNumber);
    </script>
  </body>
</html>
