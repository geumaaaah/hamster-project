<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5efe2" />
    <title>햄스터가 알려주는 오늘의 행운 숫자</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Gowun+Batang:wght@400;700&display=swap');

      :root {
        --ink: #173f3a;
        --muted: #6c7b73;
        --paper: #f5efe2;
        --card: #fffdf8;
        --coral: #e66e50;
        --gold: #e9b949;
        --line: rgba(23, 63, 58, 0.13);
        --glow: rgba(233, 185, 73, 0.22);
        --wash: #f8e8d8;
        --leaf: #dcebe1;
        --card-border: rgba(23, 63, 58, 0.08);
        --card-shadow: rgba(23, 63, 58, 0.08);
        --card-depth: rgba(98, 73, 41, 0.11);
        color-scheme: light;
      }

      :root[data-theme='dark'] {
        --ink: #f5eee1;
        --muted: #b6bdb5;
        --paper: #142b2a;
        --card: #1d3936;
        --coral: #ff9274;
        --gold: #f3c85c;
        --line: rgba(245, 238, 225, 0.16);
        --glow: rgba(243, 200, 92, 0.13);
        --wash: #243e39;
        --leaf: #183b39;
        --card-border: rgba(245, 238, 225, 0.12);
        --card-shadow: rgba(0, 0, 0, 0.2);
        --card-depth: rgba(0, 0, 0, 0.3);
        color-scheme: dark;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--ink);
        background:
          radial-gradient(circle at 85% 14%, var(--glow) 0 8rem, transparent 8.1rem),
          linear-gradient(135deg, var(--paper) 0%, var(--wash) 54%, var(--leaf) 100%);
        font-family: 'DM Sans', sans-serif;
      }

      main {
        width: min(100% - 40px, 1080px);
        min-height: 100vh;
        margin: 0 auto;
        display: grid;
        grid-template-rows: auto 1fr auto;
        padding: 32px 0 28px;
      }

      header { display: flex; justify-content: space-between; align-items: center; }

      .brand { display: flex; gap: 11px; align-items: center; font-weight: 700; letter-spacing: 0.02em; }
      .brand-mark { color: var(--coral); font-size: 25px; }
      .date { color: var(--muted); font-size: 13px; }
      .header-tools { display: flex; align-items: center; gap: 14px; }
      .theme-toggle {
        display: grid;
        width: 38px;
        height: 38px;
        place-items: center;
        padding: 0;
        border: 1px solid var(--line);
        color: var(--ink);
        background: var(--card);
        font-size: 17px;
        line-height: 1;
      }
      .theme-toggle:hover { color: var(--card); background: var(--coral); }

      .hero {
        display: grid;
        grid-template-columns: minmax(0, 0.9fr) minmax(300px, 1.1fr);
        align-items: center;
        gap: clamp(44px, 9vw, 110px);
        padding: 56px 0 70px;
      }

      .eyebrow { margin: 0 0 18px; color: var(--coral); font-size: 12px; font-weight: 700; letter-spacing: 0.17em; }
      h1 { max-width: 500px; margin: 0; font-family: 'Gowun Batang', serif; font-size: clamp(42px, 6vw, 76px); line-height: 1.13; letter-spacing: -0.04em; }
      .intro { max-width: 360px; margin: 24px 0 0; color: var(--muted); font-size: 16px; line-height: 1.8; }

      .number-wrap { position: relative; display: grid; place-items: center; }
      .number-card {
        position: relative;
        width: min(100%, 430px);
        aspect-ratio: 1 / 1;
        display: grid;
        place-items: center;
        overflow: hidden;
        filter: drop-shadow(0 20px 25px var(--card-depth));
      }
      .hamster { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
      .hamster-dark { display: none; }
      :root[data-theme='dark'] .hamster-light { display: none; }
      :root[data-theme='dark'] .hamster-dark { display: block; }
      .number { position: absolute; z-index: 1; top: 65%; color: var(--coral); font-size: clamp(96px, 15vw, 156px); font-weight: 700; line-height: 1; letter-spacing: -0.08em; text-shadow: 0 2px 0 rgba(255, 255, 255, 0.3); transform: translateY(-50%); }
      :root[data-theme='dark'] .number { color: var(--gold); text-shadow: 0 2px 0 rgba(0, 0, 0, 0.45), 0 0 16px rgba(243, 200, 92, 0.3); }
      .number-label { position: absolute; z-index: 2; top: 81%; color: var(--muted); font-size: 10px; font-weight: 700; letter-spacing: 0.12em; transform: translateY(-50%); }
      .hamster-message { position: absolute; z-index: 3; top: 2%; left: 50%; width: min(82%, 280px); margin: 0; padding: 10px 14px; border: 1px solid var(--line); border-radius: 16px; color: var(--ink); background: var(--card); box-shadow: 0 8px 18px var(--card-depth); font-size: 13px; font-weight: 700; line-height: 1.45; text-align: center; transform: translateX(-50%); }
      .hamster-message::after { content: ''; position: absolute; bottom: -7px; left: 50%; width: 12px; height: 12px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); background: var(--card); transform: translateX(-50%) rotate(45deg); }

      .actions { display: flex; align-items: center; gap: 16px; margin-top: 34px; }
      button { border: 0; border-radius: 999px; padding: 14px 21px; color: #fffdf8; background: var(--ink); font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; transition: transform 180ms ease, background 180ms ease; }
      button:hover { background: var(--coral); transform: translateY(-2px); }
      button:focus-visible { outline: 3px solid var(--gold); outline-offset: 4px; }
      .hint { color: var(--muted); font-size: 12px; }

      footer { display: flex; justify-content: space-between; border-top: 1px solid var(--line); padding-top: 18px; color: var(--muted); font-size: 12px; }

      @media (max-width: 700px) {
        main { width: min(100% - 32px, 500px); padding-top: 24px; }
        header { align-items: flex-start; }
        .header-tools { gap: 10px; }
        .date { max-width: 120px; text-align: right; line-height: 1.5; }
        .hero { grid-template-columns: 1fr; gap: 44px; padding: 64px 0 56px; }
        h1 { font-size: clamp(42px, 14vw, 66px); }
        .intro { margin-top: 18px; font-size: 15px; }
        .number-card { width: min(100%, 350px); }
        .actions { flex-wrap: wrap; }
        footer { gap: 16px; line-height: 1.5; }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div class="brand"><span class="brand-mark" aria-hidden="true">✦</span><span>LUCKY NOTE</span></div>
        <div class="header-tools">
          <time class="date" id="today"></time>
          <button class="theme-toggle" id="theme-toggle" type="button" aria-label="다크 모드로 전환" title="다크 모드로 전환"><span aria-hidden="true">◐</span></button>
        </div>
      </header>

      <section class="hero" aria-labelledby="page-title">
        <div>
          <p class="eyebrow">A LITTLE SIGN FOR TODAY</p>
          <h1 id="page-title">오늘,<br />당신의 숫자</h1>
          <p class="intro">햄스터가 오늘의 행운 숫자를 들고 왔어요. 작은 행운은 생각보다 가까이 있습니다.</p>
          <div class="actions">
            <button id="draw-button" type="button">다시 뽑기 <span aria-hidden="true">↗</span></button>
            <span class="hint">5분마다 한 번 뽑을 수 있어요</span>
          </div>
        </div>

        <div class="number-wrap">
          <div class="number-card" aria-live="polite">
            <img class="hamster hamster-light" src="assets/hamster-light.png" alt="행운 숫자 팻말을 든 귀여운 햄스터" />
            <img class="hamster hamster-dark" src="assets/hamster-dark.png" alt="행운 숫자 팻말을 든 무서운 햄스터" />
            <span class="number" id="lucky-number">7</span>
            <span class="number-label">YOUR LUCKY NUMBER</span>
            <p class="hamster-message" id="hamster-message" role="status" hidden></p>
          </div>
        </div>
      </section>

      <footer><span>오늘의 좋은 흐름을 믿어보세요.</span><span>01 — 365</span></footer>
    </main>

    <script>
      const themeToggle = document.querySelector('#theme-toggle');
      const savedTheme = localStorage.getItem('theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)');

      function applyTheme(theme, persist = false) {
        document.documentElement.dataset.theme = theme;
        const isDark = theme === 'dark';
        themeToggle.setAttribute('aria-label', isDark ? '화이트 모드로 전환' : '다크 모드로 전환');
        themeToggle.setAttribute('title', isDark ? '화이트 모드로 전환' : '다크 모드로 전환');
        themeToggle.querySelector('span').textContent = isDark ? '☀' : '◐';
        document.querySelector('meta[name="theme-color"]').setAttribute('content', isDark ? '#142b2a' : '#f5efe2');
        if (persist) localStorage.setItem('theme', theme);
      }

      applyTheme(savedTheme || (prefersDark.matches ? 'dark' : 'light'));
      themeToggle.addEventListener('click', () => {
        applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark', true);
      });

      const today = new Date();
      const dateFormatter = new Intl.DateTimeFormat('ko-KR', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });
      document.querySelector('#today').textContent = dateFormatter.format(today);

      const dayKey = `${today.getFullYear()}-${today.getMonth() + 1}-${today.getDate()}`;
      const cooldownMs = 5 * 60 * 1000;
      const numberKey = `lucky-number-${dayKey}`;
      const seedKey = `lucky-number-seed-${dayKey}`;
      const cooldownKey = `lucky-number-next-draw-${dayKey}`;
      const initialSeed = [...dayKey].reduce((total, character) => total + character.charCodeAt(0), 0);
      let seed = Number(localStorage.getItem(seedKey)) || initialSeed;
      const numberElement = document.querySelector('#lucky-number');
      const drawButton = document.querySelector('#draw-button');
      const hamsterMessage = document.querySelector('#hamster-message');

      function formatRemainingTime(milliseconds) {
        const totalSeconds = Math.ceil(milliseconds / 1000);
        const minutes = Math.floor(totalSeconds / 60);
        const seconds = totalSeconds % 60;
        return minutes > 0 ? `${minutes}분 ${seconds}초` : `${seconds}초`;
      }

      function showHamsterMessage(message) {
        hamsterMessage.textContent = message;
        hamsterMessage.hidden = false;
      }

      function drawNumber(startCooldown = true) {
        seed = (seed * 9301 + 49297) % 233280;
        numberElement.textContent = String(Math.floor((seed / 233280) * 99) + 1);
        localStorage.setItem(seedKey, String(seed));
        localStorage.setItem(numberKey, numberElement.textContent);

        if (startCooldown) {
          localStorage.setItem(cooldownKey, String(Date.now() + cooldownMs));
          showHamsterMessage('새 행운 숫자를 골랐어! 5분 뒤에 또 만나요.');
        }
      }

      const savedNumber = localStorage.getItem(numberKey);
      if (savedNumber) numberElement.textContent = savedNumber;
      else drawNumber(false);

      drawButton.addEventListener('click', () => {
        const nextDrawAt = Number(localStorage.getItem(cooldownKey)) || 0;
        const remainingTime = nextDrawAt - Date.now();

        if (remainingTime > 0) {
          showHamsterMessage(`아직 기다려야 해! ${formatRemainingTime(remainingTime)} 뒤에 다시 뽑을 수 있어.`);
          return;
        }

        drawNumber();
      });
    </script>
  </body>
</html>
